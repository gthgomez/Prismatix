name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'campaign/**', 'feat/**']

jobs:
  ci:
    name: Type Check / Lint / Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check Edge Functions
        run: |
          for f in supabase/functions/*/index.ts; do
            if [ -f "$f" ]; then
              echo "Checking $f..."
              deno check --config supabase/functions/deno.json "$f"
            fi
          done

      - name: Stale-model coupling budget
        run: node scripts/audit-stale-models.mjs --check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright acceptance tests
        run: npx playwright test --project=chromium
