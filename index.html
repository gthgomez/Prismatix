<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Prismatix - Adaptive multi-model AI orchestration" />
    <meta name="theme-color" content="#03070b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Prismatix</title>
    <link rel="icon" type="image/svg+xml" href="/prismatix-icon-draft.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preload fonts for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* Prevent FOUC. Document scroll stays available; the chat shell locks itself. */
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #03070b;
        color: #e8eef2;
      }

      #root {
        height: 100%;
      }

      /* Loading indicator */
      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-family: monospace;
        color: #4ECDC4;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(78, 205, 196, 0.2);
        border-top-color: #4ECDC4;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .startup-recovery {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: 24px;
        box-sizing: border-box;
        background: #03070b;
        color: #e8eef2;
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }

      .startup-recovery h1 { margin: 0; font-size: 1.25rem; }
      .startup-recovery p { max-width: 30rem; margin: 0; color: #c5d0d8; }
      .startup-recovery button {
        justify-self: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid #67d6d0;
        border-radius: 10px;
        background: #0d292d;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div>Loading Prismatix...</div>
      </div>
    </div>
    <script>
      (() => {
        const updateAttemptKey = 'prismatix-startup-update-attempted';
        let recoveryShown = false;

        const showRecovery = () => {
          if (recoveryShown) return;
          recoveryShown = true;
          const root = document.getElementById('root');
          if (!root) return;
          const panel = document.createElement('main');
          panel.className = 'startup-recovery';
          panel.setAttribute('role', 'alert');
          const title = document.createElement('h1');
          title.textContent = 'Prismatix could not load';
          const message = document.createElement('p');
          message.textContent = 'The app files may have changed. Prismatix is checking for an update. If this screen stays here, reload the app.';
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = 'Reload Prismatix';
          button.addEventListener('click', () => window.location.reload());
          panel.append(title, message, button);
          root.replaceChildren(panel);
        };

        const checkForUpdateOnce = async () => {
          try {
            if (sessionStorage.getItem(updateAttemptKey)) return;
            sessionStorage.setItem(updateAttemptKey, '1');
          } catch {
            return;
          }

          if (!('serviceWorker' in navigator)) return;
          try {
            const registration = await navigator.serviceWorker.getRegistration();
            if (!registration) return;
            await registration.update();
            const installing = registration.installing;
            if (!installing) return;
            await new Promise((resolve) => {
              const timeout = window.setTimeout(resolve, 8000);
              installing.addEventListener('statechange', () => {
                if (installing.state === 'activated' || installing.state === 'redundant') {
                  window.clearTimeout(timeout);
                  resolve(undefined);
                }
              });
            });
            if (installing.state === 'activated') window.location.reload();
          } catch {
            // The visible recovery button remains available when updates fail.
          }
        };

        window.__prismatixStartupFailure = () => {
          showRecovery();
          void checkForUpdateOnce();
        };
        window.__prismatixStartupUpdate = () => void checkForUpdateOnce();
        window.__prismatixStartupRetry = () => window.location.reload();

        window.addEventListener('error', (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement && target.type === 'module') {
            window.__prismatixStartupFailure();
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
